# Publica la web en GitHub Pages cada vez que se sube algo a main.
#
# Compila con Astro y sube la carpeta dist.
#
# Dominio: mientras no exista public/CNAME, la web sale en
# https://jesusguzman28.github.io/bitone/. Para pasar a bitone.pe: crear
# public/CNAME con la línea "bitone.pe" y poner el mismo dominio en
# Settings → Pages → Custom domain.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, gana el último y no se pisan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: astro.config.mjs lee la fecha del último commit que
      # tocó src/ para el `lastmod` del sitemap. Con un clon superficial esa
      # fecha sería siempre la del despliegue.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sin public/CNAME no hay dominio propio todavía: la web se sirve en
      # https://<usuario>.github.io/<repo>/ y hay que anteponer esa subcarpeta
      # a todas las rutas. Al crear public/CNAME este paso deja de correr.
      - name: Ruta provisional en github.io
        if: ${{ hashFiles('public/CNAME') == '' }}
        run: node scripts/ruta-provisional.mjs "/${{ github.event.repository.name }}" "https://${{ github.repository_owner }}.github.io"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
