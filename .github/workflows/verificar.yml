# Compila y verifica el sitio en cada pull request, sin publicar nada.
# Publicar sigue siendo solo al subir a main (publicar.yml).
name: Verificar

on:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verificar
